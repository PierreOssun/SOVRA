[package]
name = "sovra-api"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
config = "0.15"
serde = { version = "1", features = ["derive"] }
sovra-ipc = { workspace = true }
sovra-eth = { workspace = true, features = ["rpc"] }
sovra-network = { workspace = true }
sovra-observability = { workspace = true }
sovra-mpc = { workspace = true }
sovra-state = { workspace = true }
sovra-types = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
alloy-primitives = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
axum = { workspace = true }
alloy-provider = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
tracing = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
# "rustls" made explicit: the api relies on the same mTLS client stack as
# sovra-ipc, not on feature unification happening to enable it.
reqwest = { workspace = true, features = ["json", "rustls"] }

[dev-dependencies]
# Test backend only: sovra-api's own code is backend-agnostic behind MpcBackend.
sovra-mpc-dkls23-carbon = { workspace = true }
alloy-consensus = { workspace = true }
alloy-transport = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
tempfile = { workspace = true }
ed25519-dalek = { workspace = true }
sovra-cosigner = { workspace = true }
sovra-policy = { workspace = true }
sovra-certs = { workspace = true }
