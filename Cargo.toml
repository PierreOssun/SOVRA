[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
authors = ["Pierre Ossun"]
description = "Sovra"
rust-version = "1.85"

[workspace.dependencies]
# default-features off at the workspace level so lean consumers (cosigner,
# in-process backend) get the pure core; sovra-api opts into "rpc".
sovra-eth = { path = "crates/sovra-eth", default-features = false }
sovra-observability = { path = "crates/sovra-observability" }
sovra-policy = { path = "crates/sovra-policy" }
sovra-types = { path = "crates/sovra-types" }
sovra-state = { path = "crates/sovra-state" }
sovra-mpc = { path = "crates/sovra-mpc" }
sovra-mpc-dkls23-silence = { path = "crates/sovra-mpc-dkls23-silence" }
sovra-ipc = { path = "crates/sovra-ipc" }
sovra-certs = { path = "crates/sovra-certs" }
sovra-cosigner = { path = "crates/sovra-cosigner" }
alloy-consensus = "2.0.5"
alloy-eips = "2.1.0"
alloy-primitives = "1.6.0"
alloy-provider = "2.1.0"
alloy-transport = "2.1.0"
alloy-network = "2.1.0"
alloy-rpc-types-eth = "2.1.0"
thiserror = "2.0.18"
tokio = "1.52.3"
alloy-signer = "2.0.5"
alloy-signer-local = "2.0.5"
url = "2.5.8"
http = "1.4.2"
axum = "0.8.9"
serde_json = "1.0.150"
utoipa-swagger-ui = "9.0.2"
utoipa = "5.5.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
sl-dkls23 = "1.0.0-beta"
sl-mpc-mate = "1.0.0-beta"
# Note: k256/rand/ed25519-dalek are generation-locked by sl-dkls23 1.0.0-beta and
# alloy-primitives 1.x (k256 0.13 / ecdsa 0.16, dalek 2.x, rand_core 0.6) —
# bumping any of them splits the crypto types into two incompatible worlds.
k256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8"
derivation-path = "0.2.0"
alloy-rlp = "0.3.12"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1.3"
tempfile = "3"
clap = "4"
reqwest = { version = "0.13", default-features = false }
# TLS stack: rustls rides the aws-lc-rs provider (same one reqwest's "rustls"
# feature pulls in) — never enable its "ring" feature or the process-level
# CryptoProvider becomes ambiguous and ClientConfig::builder() panics.
rustls = "0.23.40"
rustls-pki-types = "1.14.1"
# default-features off to swap rcgen's ring backend for the aws-lc-rs already in
# the tree (one crypto stack); sovra-certs opts into aws_lc_rs/pem/x509-parser.
rcgen = { version = "0.14.8", default-features = false }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
time = "0.3"
x509-parser = "0.18.1"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
tokio-tungstenite = "0.30.0"
toml = "1.1"
futures-util = "0.3"
