[package]
name = "sovra-ipc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sovra-mpc = { workspace = true }
axum = { workspace = true, features = ["ws"] }
# rustls-tls-webpki-roots is the only public route to Connector::Rustls; the
# webpki roots it pulls go unused — WsRelay always passes an explicit connector.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "net", "time"] }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sl-mpc-mate = { workspace = true, features = ["simple-relay"] }
alloy-primitives = { workspace = true, features = ["serde"] }
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
axum-server = { workspace = true }

[features]
# xtask-only: reqwest's blocking runtime for the synchronous readiness probes.
# The async binaries (sovra-api, sovra-cosigner) never enable this.
blocking = ["reqwest/blocking"]

[dev-dependencies]
sovra-certs = { workspace = true }
tempfile = { workspace = true }
