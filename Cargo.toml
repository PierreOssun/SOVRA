[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
authors = ["Pierre Ossun"]
description = "Sovra"
rust-version = "1.85"

[workspace.dependencies]
# default-features off at the workspace level so lean consumers (cosigner,
# in-process backend) get the pure core; sovra-api opts into "rpc".
sovra-eth = { path = "crates/sovra-eth", default-features = false }
sovra-observability = { path = "crates/sovra-observability" }
sovra-network = { path = "crates/sovra-network" }
sovra-policy = { path = "crates/sovra-policy" }
sovra-types = { path = "crates/sovra-types" }
sovra-state = { path = "crates/sovra-state" }
sovra-mpc = { path = "crates/sovra-mpc" }
sovra-mpc-dkls23-carbon = { path = "crates/sovra-mpc-dkls23-carbon" }
sovra-ipc = { path = "crates/sovra-ipc" }
sovra-certs = { path = "crates/sovra-certs" }
sovra-cosigner = { path = "crates/sovra-cosigner" }
alloy-consensus = "2.0.5"
alloy-eips = "2.1.0"
alloy-primitives = "1.6.0"
alloy-provider = "2.1.0"
alloy-transport = "2.1.0"
alloy-network = "2.1.0"
alloy-rpc-types-eth = "2.1.0"
thiserror = "2.0.18"
tokio = "1.52.3"
alloy-signer = "2.0.5"
alloy-signer-local = "2.0.5"
url = "2.5.8"
http = "1.4.2"
axum = "0.8.9"
serde_json = "1.0.150"
utoipa-swagger-ui = "9.0.2"
utoipa = "5.5.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
# Note: k256/rand are generation-locked by alloy-primitives 1.x (k256 0.13 /
# ecdsa 0.16, rand_core 0.6) — bumping either splits the crypto types into two
# incompatible worlds. The MPC backend pins its own k256 0.14-rc crate-locally
# (see crates/sovra-mpc-dkls23-carbon/Cargo.toml); the generations never mix.
k256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8"
alloy-rlp = "0.3.12"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1.3"
tempfile = "3"
clap = "4"
reqwest = { version = "0.13", default-features = false }
# TLS stack: rustls rides the aws-lc-rs provider (same one reqwest's "rustls"
# feature pulls in) — never enable its "ring" feature or the process-level
# CryptoProvider becomes ambiguous and ClientConfig::builder() panics.
rustls = "0.23.40"
rustls-pki-types = "1.14.1"
# default-features off to swap rcgen's ring backend for the aws-lc-rs already in
# the tree (one crypto stack); sovra-certs opts into aws_lc_rs/pem/x509-parser.
rcgen = { version = "0.14.8", default-features = false }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
time = "0.3"
x509-parser = "0.18.1"
serde = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
tokio-tungstenite = "0.30.0"
toml = "1.1"
futures-util = "0.3"
# XChaCha20-Poly1305 shard sealing (sovra-state); same RustCrypto generation as k256 0.13.
chacha20poly1305 = "0.10.1"
# Relay-envelope crypto (sovra-mpc): sealed-box ECDH from the ed25519
# identities plus the KDF hash. Both already in the tree transitively at
# exactly these versions (k256/ed25519-dalek), so these lines add edges,
# not crates.
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# MPC crypto is 10-50x slower unoptimized: a debug-build 2-of-3 DKG blows
# through the 10 s ceremony ttl the tests (and ops defaults) assume. Optimize
# just the hot crypto crates in dev; sovra code stays debuggable. Entries
# apply to every version of a crate (both k256 generations, both sha2s).
[profile.dev.package.dkls23-core]
opt-level = 3
[profile.dev.package.dkls23-secp256k1]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.rustcrypto-ff]
opt-level = 3
[profile.dev.package.rustcrypto-group]
opt-level = 3
