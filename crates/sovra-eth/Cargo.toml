[package]
name = "sovra-eth"
version.workspace = true
edition = "2024"
publish = false

[features]
default = ["rpc"]
# The RPC-touching shell: enrich, prepare_from_rpc, http_provider and the
# provider/transport stack behind them. Off for lean consumers (the cosigner)
# that only decode, validate, hash, and finalize.
rpc = [
  "dep:alloy-provider",
  "dep:alloy-rpc-types-eth",
  "dep:alloy-transport",
  "dep:url",
  "dep:tokio",
]

[dependencies]
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips = { workspace = true }
alloy-provider = { workspace = true, optional = true }
alloy-transport = { workspace = true, optional = true }
alloy-rpc-types-eth = { workspace = true, optional = true }
thiserror = { workspace = true }
alloy-rlp = { workspace = true }
serde = { workspace = true }
sovra-types = { workspace = true }
sovra-network = { workspace = true }
k256 = { workspace = true }
url = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
