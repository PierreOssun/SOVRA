# Configuration for `cargo deny` (https://embarkstudios.github.io/cargo-deny/).
# Run locally with: cargo deny check

[advisories]
version = 2
# Security advisories from the RustSec database are denied by default.
# These two are "unmaintained" advisories (not vulnerabilities), pulled in
# transitively by Alloy with no safe upgrade available on our end.
ignore = [
  "RUSTSEC-2024-0436", # paste - no longer maintained
  "RUSTSEC-2026-0173", # proc-macro-error2 - unmaintained
]

[licenses]
version = 2
# Common permissive licenses used across the Rust/Alloy ecosystem.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",            # webpki-root-certs, transitive via reqwest -> alloy-provider
  # Silence Laboratories DKLs23 crates (sl-dkls23 chain) publish no license
  # metadata on crates.io; they are used under Silence's separate non-commercial
  # license — the reason every sovra-* crate is publish = false. Clarified below.
  "LicenseRef-SilenceLaboratories-NonCommercial",
]
confidence-threshold = 0.8
# Our own sovra-* crates are unpublished (publish = false) and intentionally carry
# no license field (the project links a non-commercial dependency); skip them.
private = { ignore = true }

# The sl-* crates carry neither a `license` field nor a LICENSE file, so
# cargo-deny reports them as `unlicensed`. Clarify them explicitly as Silence's
# non-commercial license rather than mislabel them as a permissive OSS license.
[[licenses.clarify]]
crate = "sl-dkls23"
expression = "LicenseRef-SilenceLaboratories-NonCommercial"
license-files = []

[[licenses.clarify]]
crate = "sl-mpc-mate"
expression = "LicenseRef-SilenceLaboratories-NonCommercial"
license-files = []

[[licenses.clarify]]
crate = "sl-oblivious"
expression = "LicenseRef-SilenceLaboratories-NonCommercial"
license-files = []

[bans]
# Surface duplicate versions of the same crate without failing the build.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
