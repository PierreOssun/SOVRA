# The always-on rented box: cosigner 0 and nothing else — it holds exactly
# one (sealed) shard, no orchestrator, no policy authority beyond its own.
# Fill .env (see cloud.env.example), then `docker compose -f cloud.yml up -d`.
# See mac.yml for the host-networking and SOVRA_UID rationale; :4100 is the
# only port facing the tailnet.
name: sovra-cloud

services:
  cosigner0:
    image: ${SOVRA_IMAGE:-ghcr.io/pierreossun/sovra}-cosigner:${SOVRA_TAG:-latest}
    network_mode: host
    user: "${SOVRA_UID:?run 'sovra init cloud' to write SOVRA_UID into .env}"
    restart: unless-stopped
    environment:
      SOVRA_COSIGNER_PARTY_ID: "0"
      SOVRA_COSIGNER_BIND_ADDR: 0.0.0.0:4100
      SOVRA_COSIGNER_DATA_DIR: /opt/sovra/data
      SOVRA_COSIGNER_POLICY_PATH: /opt/sovra/config/policy0.toml
      SOVRA_COSIGNER_TLS_CA_PATH: /opt/sovra/certs/ca.cert.pem
      SOVRA_COSIGNER_TLS_CERT_PATH: /opt/sovra/certs/cosigner0.cert.pem
      SOVRA_COSIGNER_TLS_KEY_PATH: /opt/sovra/certs/cosigner0.key.pem
      SOVRA_COSIGNER_RELAY_URL: wss://${MAC_TS_IP}:3100/env
      SOVRA_COSIGNER_PARTICIPANTS: ${SOVRA_PARTICIPANTS:-}
      # Sealed at rest by default; `sovra init` seeds the key.
      SOVRA_COSIGNER_SEAL_KEY_PATH: /opt/sovra/certs/seal0.key
    volumes:
      - ./data:/opt/sovra/data
      - ${SOVRA_CERTS_DIR:-./certs}:/opt/sovra/certs:ro
      - ${SOVRA_CONFIG_DIR:-./config}:/opt/sovra/config:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs --cacert /opt/sovra/certs/ca.cert.pem --cert /opt/sovra/certs/cosigner0.cert.pem --key /opt/sovra/certs/cosigner0.key.pem https://127.0.0.1:4100/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
