# Signing policy for cosigner 0 — evaluated locally on every /sign, before
# any MPC message. Every key is required; the process refuses to start on a
# missing, unreadable, or partially parsed file (fail-closed).
allowed_chain_ids = [11155111] # Sepolia only

# List of 0x-addresses, or the single entry "*" for any recipient.
# An EMPTY list denies every recipient. Default: the RUN.md demo burn address.
allowed_recipients = ["0x000000000000000000000000000000000000dead"]

# Decimal string, NOT a TOML integer (i64 would cap at ~9.2 ETH).
max_value_wei = "1000000000000000000" # 1 ETH

# false = calldata must be exactly empty (plain value transfers only).
allow_calldata = false
